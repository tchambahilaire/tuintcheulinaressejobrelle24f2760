<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erreur {{ code }} - NutriTrack</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .error-container { background: white; border-radius: 20px; padding: 3rem; text-align: center; max-width: 500px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .error-code { font-size: 6rem; font-weight: bold; color: #667eea; margin: 0; }
        .error-message { font-size: 1.5rem; color: #333; margin: 1rem 0; }
        .error-suggestion { color: #666; margin-bottom: 2rem; }
        .btn { display: inline-block; padding: 1rem 2rem; background: #667eea; color: white; text-decoration: none; border-radius: 50px; font-weight: bold; }
        .btn:hover { background: #5a67d8; }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">{{ code }}</div>
        <div class="error-message">{{ message }}</div>
        <div class="error-suggestion">{{ suggestion }}</div>
        <a href="/" class="btn">🏠 Retour à l'accueil</a>
    </div>
</body>
</html>
